<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { padding: 1rem; }
        #message-container { margin: 0.5rem 0; }
        #message-container.error   { color: red; }
        #message-container.success { color: green; }
    </style>
    <script src="manage_users.js" defer></script>
</head>
<body>

    <header>
        <h1>Admin Portal</h1>
    </header>

    <main>

     
        <section>
            <h2>Change Your Password</h2>
            <form id="password-form" action="#">
                <fieldset>
                    <legend>Password Update</legend>

                    <label for="current-password">Current Password</label>
                    <input type="password" id="current-password" name="current_password" required>

                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new_password" minlength="8" required>

                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" required>

                    <button type="submit" id="change">Update Password</button>
                </fieldset>
            </form>
        </section>

   
        <section>
            <h2>Manage Users</h2>

            <details>
                <summary>Add New User</summary>
                <form id="add-user-form" action="#">
                    <fieldset>
                        <legend>New User Information</legend>

                        <label for="user-name">Full Name</label>
                        <input type="text" id="user-name" name="name" required>

                        <label for="user-email">Email Address</label>
                        <input type="email" id="user-email" name="email" required>

                        <label for="default-password">Default Password</label>
                        <input type="password" id="default-password" name="password" minlength="8" required>

                        <label for="is-admin">Role</label>
                        <select id="is-admin" name="is_admin">
                            <option value="0">Student</option>
                            <option value="1">Admin</option>
                        </select>

                        <button type="submit" id="add">Add User</button>
                    </fieldset>
                </form>
            </details>

            <div id="message-container"></div>

            <input id="search-input" type="search" placeholder="Search by name or email...">

            <table id="user-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body"></tbody>
            </table>

        </section>

    </main>

</body>
</html>
